<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 640 520"
    role="img"
    aria-labelledby="title description"
>
    <title id="title">Ilustración de desarrollo web</title>
    <desc id="description">
        Computadora con una interfaz de código y elementos gráficos.
    </desc>

    <defs>
        <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#e0f2fe"/>
            <stop offset="100%" stop-color="#dbeafe"/>
        </linearGradient>

        <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#172554"/>
            <stop offset="100%" stop-color="#1e3a8a"/>
        </linearGradient>

        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow
                dx="0"
                dy="18"
                stdDeviation="18"
                flood-color="#1e3a8a"
                flood-opacity=".18"
            />
        </filter>
    </defs>

    <rect width="640" height="520" rx="48" fill="url(#background)"/>

    <circle cx="92" cy="88" r="38" fill="#ffffff" opacity=".7"/>
    <circle cx="558" cy="430" r="54" fill="#bfdbfe" opacity=".8"/>
    <path
        d="M510 76c52 8 86 43 80 85-6 40-51 60-94 45-43-16-61-53-42-87 12-23 31-38 56-43Z"
        fill="#99f6e4"
        opacity=".65"
    />

    <g filter="url(#shadow)">
        <rect x="90" y="108" width="460" height="304" rx="22" fill="#ffffff"/>

        <rect
            x="108"
            y="126"
            width="424"
            height="238"
            rx="14"
            fill="url(#screen)"
        />

        <circle cx="132" cy="148" r="6" fill="#fb7185"/>
        <circle cx="152" cy="148" r="6" fill="#facc15"/>
        <circle cx="172" cy="148" r="6" fill="#4ade80"/>

        <rect x="138" y="190" width="112" height="12" rx="6" fill="#5eead4"/>
        <rect x="138" y="222" width="230" height="10" rx="5" fill="#93c5fd"/>
        <rect x="170" y="250" width="198" height="10" rx="5" fill="#c4b5fd"/>
        <rect x="170" y="278" width="146" height="10" rx="5" fill="#f9a8d4"/>
        <rect x="138" y="306" width="256" height="10" rx="5" fill="#93c5fd"/>

        <path d="M255 412h130l26 34H229l26-34Z" fill="#dbeafe"/>
        <rect x="208" y="444" width="224" height="18" rx="9" fill="#ffffff"/>
    </g>

    <g transform="translate(438 250)">
        <rect width="104" height="104" rx="22" fill="#ffffff"/>
        <path
            d="M36 52 48 64 72 38"
            fill="none"
            stroke="#14b8a6"
            stroke-width="10"
            stroke-linecap="round"
            stroke-linejoin="round"
        />
    </g>

    <g transform="translate(62 318)">
        <rect width="112" height="86" rx="20" fill="#ffffff"/>
        <rect x="24" y="24" width="64" height="10" rx="5" fill="#60a5fa"/>
        <rect x="24" y="46" width="44" height="10" rx="5" fill="#a78bfa"/>
    </g>
</svg>